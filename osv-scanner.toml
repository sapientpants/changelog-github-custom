# OSV Scanner Configuration
# https://google.github.io/osv-scanner/configuration/

# Ignored Vulnerabilities
# Review and update regularly when fixes become available.

# GHSA-g3hv-75wg-m249: minimatch < 11.0.1 potential denial of service via
# globparts amplification.
#
# Every other minimatch in the lockfile is overridden to >= 11.0.1 in
# pnpm-workspace.yaml. These two copies cannot be bumped: depcheck@1.4.7
# (latest) and its dependency multimatch@5.0.0 import minimatch 7.x / 3.x
# through the old default export, which minimatch 11 no longer provides, so
# depcheck crashes on startup when overridden.
#
# Reason for ignoring:
# - Dev dependency only (depcheck runs in `pnpm deps:check`)
# - Only ever matches the project's own, hard-coded glob patterns; no
#   untrusted input reaches it
# - Not shipped to consumers of the package
#
# Action items:
# - Remove when depcheck releases a version on minimatch >= 11, or if
#   depcheck is replaced
#
# Added: 2026-10-31
# Review: 2026-11-30 (30 days)

[[PackageOverrides]]
name = "minimatch"
version = "7.4.9"
ecosystem = "npm"
ignore = true
reason = "Dev-only dependency of depcheck; cannot be bumped without breaking depcheck. See comment above."

[[PackageOverrides]]
name = "minimatch"
version = "3.1.5"
ecosystem = "npm"
ignore = true
reason = "Dev-only dependency of depcheck via multimatch; cannot be bumped without breaking depcheck. See comment above."
