# markdownlint-cli2 options. Rule configuration lives in .markdownlint.yaml.
# NOTE: markdownlint-cli2 does NOT read .markdownlintignore, so ignores must live here.
# These apply to `pnpm lint:markdown` and to the lint-staged pre-commit run alike.
ignores:
  # Auto-generated by the changesets release job
  - CHANGELOG.md
  - node_modules/**
  # Coverage reports
  - coverage/**
  # Build output
  - dist/**
  # aider chat history
  - .aider.chat.history.md
