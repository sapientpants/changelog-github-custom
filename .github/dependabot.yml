# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Keep the commit-SHA pins in .github/workflows/ and .github/actions/ current.
  # Dependabot updates the SHA and the trailing "# vX.Y.Z" comment together,
  # which is what scripts/check-action-pins.sh requires.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
