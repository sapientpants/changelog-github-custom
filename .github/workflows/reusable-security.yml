# =============================================================================
# REUSABLE WORKFLOW: Security Scanning Suite
# PURPOSE: Run dependency security scans (pnpm audit, optional OSV scan)
# USAGE: Called by PR and main workflows for security validation
# OUTPUTS: OSV findings uploaded to GitHub Security tab (SBOM is generated by the
#          create-release job in main.yml)
# NOTE: CodeQL has its own dedicated workflow (codeql.yml) for better integration
# =============================================================================

name: Reusable Security

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version (should match package.json engines.node)'
        type: string
        default: '24' # UPDATE: When upgrading Node.js
      pnpm-version:
        description: 'pnpm version (should match package.json packageManager)'
        type: string
        default: '11.20.0' # UPDATE: When upgrading pnpm
      run-osv-scan:
        description: 'Run OSV scanner for dependency vulnerabilities'
        type: boolean
        default: true

# SECURITY: Required permissions for security scanning
permissions:
  actions: read # Read workflow metadata
  contents: read # Read source code
  security-events: write # Upload security findings

# EXAMPLE USAGE:
# jobs:
#   security:
#     uses: ./.github/workflows/reusable-security.yml
#     with:
#       run-osv-scan: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for accurate analysis

      # =============================================================================
      # ENVIRONMENT SETUP
      # Required for pnpm audit
      # =============================================================================

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm # Cache dependencies for speed

      - name: Install dependencies
        # Dependencies needed so pnpm audit sees the resolved tree
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # Check for known vulnerabilities in dependencies
        # FAILS IF: Critical vulnerabilities found
        # To fix: Run 'pnpm update' or add overrides in pnpm-workspace.yaml
        run: pnpm audit --audit-level high

  osv-scan:
    if: inputs.run-osv-scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      # Scan entire project including all manifests (package.json, pnpm-lock.yaml)
      scan-args: |-
        ./
    permissions:
      security-events: write # Required to upload findings to Security tab
      actions: read
      contents: read
