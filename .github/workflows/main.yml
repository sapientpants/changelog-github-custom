# =============================================================================
# WORKFLOW: Main Branch Release Pipeline
# PURPOSE: Automate version management, releases, and security scanning on main
# TRIGGERS: Push to main branch (merges, direct commits)
# OUTPUTS: GitHub release with artifacts, NPM package
# =============================================================================

name: Main

on:
  push:
    branches: [main]

# Prevent concurrent runs on the same ref to avoid race conditions during releases
# cancel-in-progress: false ensures releases complete even if new commits arrive
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# SECURITY: Required permissions for release automation
# contents: write - Create releases and tags
# id-token: write - Generate SLSA attestations for supply chain security
# attestations: write - Attach attestations to artifacts
# security-events: write - Upload security scan results
# actions: read - Access workflow runs and artifacts
permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write
  actions: read

jobs:
  # =============================================================================
  # VALIDATION PHASE
  # Runs all quality checks in parallel to ensure code meets standards
  # =============================================================================

  validate:
    # Reusable workflow handles: typecheck, lint, format, markdown/yaml/workflow lint, depcheck, tests
    # (pnpm audit runs in the security job below)
    # FAILS IF: Any check fails, tests don't meet 80% coverage threshold
    uses: ./.github/workflows/reusable-validate.yml

  # =============================================================================
  # SECURITY SCANNING PHASE
  # Parallel security scans to identify vulnerabilities before release
  # =============================================================================

  # Scans TypeScript/JavaScript for common security issues (XSS, SQL injection, etc.)
  security:
    uses: ./.github/workflows/reusable-security.yml

  # =============================================================================
  # UNIFIED BUILD PHASE
  # Single build job that creates artifacts to be reused throughout the workflow
  # =============================================================================

  build:
    # Gate on validation and security so a failing test suite or scan never
    # produces a permanent version commit or release tag on main
    needs: [validate, security]
    runs-on: ubuntu-latest
    outputs:
      artifact-name: dist-${{ github.sha }}
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag_sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript for changeset
        # Build BEFORE versioning so custom changelog generator is available
        run: |
          pnpm build
          echo "✅ Built TypeScript for changeset processing"

      - name: Version packages
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Custom script validates changesets and determines version
          # FAILS IF: feat/fix commits exist without changesets
          # Outputs: changed=true/false, version=X.Y.Z
          node .github/scripts/version-and-release.js

      - name: Commit version changes
        if: steps.version.outputs.changed == 'true'
        run: |
          # Configure git with GitHub Actions bot identity
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"

          # Stage version-related changes
          git add package.json CHANGELOG.md .changeset

          # When retrying a tagged-but-unreleased version, the version commit
          # already exists; only consumed empty changesets may need committing
          if git diff --cached --quiet; then
            echo "⏭️ No version changes to commit"
            exit 0
          fi

          if [ "${{ steps.version.outputs.retry }}" = "true" ]; then
            MESSAGE="chore(release): consume changesets for v${{ steps.version.outputs.version }} [skip actions]"
          else
            MESSAGE="chore(release): v${{ steps.version.outputs.version }} [skip actions]"
          fi

          # Commit with [skip actions] to prevent workflow recursion
          git commit -m "$MESSAGE"

          # Push changes to origin
          git push origin main

          echo "✅ Version changes committed and pushed"

      - name: Create and push tag
        # Create tag BEFORE building artifacts so they're associated with the tag
        id: tag
        if: steps.version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [ "${{ steps.version.outputs.retry }}" = "true" ]; then
            # Tag already exists from a previous release attempt that failed
            echo "♻️ Reusing existing tag v${VERSION}"
          else
            # Configure git
            git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
            git config --local user.name "${{ github.actor }}"

            # Create annotated tag
            git tag -a "v${VERSION}" -m "Release v${VERSION}"

            # Push tag to origin
            git push origin "v${VERSION}"
          fi

          # Get the tag SHA for artifact naming
          TAG_SHA=$(git rev-list -n 1 "v${VERSION}")
          echo "sha=${TAG_SHA}" >> $GITHUB_OUTPUT
          echo "📌 Tag SHA for artifacts: ${TAG_SHA}"

      - name: Rebuild TypeScript after version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          # Rebuild after version bump to ensure dist includes updated version
          pnpm build
          echo "✅ Rebuilt TypeScript with updated version"

      - name: Generate artifact manifest
        if: steps.version.outputs.changed == 'true'
        run: |
          # Create a manifest of what's been built
          cat > build-manifest.json <<EOF
          {
              "build_sha": "${{ github.sha }}",
              "build_time": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "node_version": "$(node --version)",
              "pnpm_version": "$(pnpm --version)",
              "typescript_version": "$(pnpm list typescript --json | jq -r '.[0].devDependencies.typescript.version')",
              "files": $(find dist -type f -name "*.js" | jq -R . | jq -s .)
          }
          EOF
          echo "📋 Generated build manifest with $(find dist -type f -name "*.js" | wc -l) JavaScript files"

      - name: Upload build artifact
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          # pnpm-workspace.yaml holds the overrides recorded in pnpm-lock.yaml;
          # they must travel together, since jobs that check out the release tag
          # (which may predate dependency updates on a retried release) install
          # with --frozen-lockfile
          path: |
            dist/
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            build-manifest.json
          retention-days: 1 # Only needed for this workflow run

  # =============================================================================
  # PREPARE RELEASE ASSETS PHASE
  # Packs and attests the npm tarball that the Publish workflow publishes as-is
  # =============================================================================

  npm:
    name: Prepare NPM Package
    needs: [validate, security, build]
    # The Publish workflow's fetch-npm-package job expects this tarball whenever
    # npm publishing is enabled
    if: vars.ENABLE_NPM_RELEASE == 'true' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.pack.outputs.built }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Install all dependencies for packaging (dev and prod)
        run: pnpm install --frozen-lockfile

      - name: Prepare package.json for publishing
        run: |
          # Strip fields that must not ship in the published package BEFORE the
          # tarball is packed and attested. The Publish workflow publishes this
          # exact tarball, so any adjustment made there would break provenance.
          # - private: publish-blocking metadata
          # - scripts.prepare: runs husky, a dev dependency, on install/pack
          jq 'del(.private) | del(.scripts.prepare)' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "✅ Stripped private flag and prepare script from package.json"

      - name: Create NPM package
        id: pack
        run: |
          # Create the NPM package tarball. This is the artifact that gets
          # attested below and published as-is by the Publish workflow.
          # Use tail -1 to get just the filename, as npm pack may output additional text
          NPM_PACKAGE=$(npm pack 2>/dev/null | tail -1)
          echo "📦 Created NPM package: $NPM_PACKAGE"

          # Generate metadata using github.sha for consistent naming with publish workflow
          ARTIFACT_NAME="npm-package-${{ needs.build.outputs.version }}-${{ github.sha }}"
          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "tarball_name=$NPM_PACKAGE"
            echo "built=true"
          } >> $GITHUB_OUTPUT

          # Create manifest of included files for verification
          npm pack --dry-run --json 2>/dev/null | jq -r '.[0].files[].path' > npm-package-manifest.txt
          echo "📋 Package contains $(wc -l < npm-package-manifest.txt) files"

      - name: Upload NPM package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: |
            *.tgz
            npm-package-manifest.txt
          retention-days: 7

      - name: Generate attestations for NPM package
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: '*.tgz'

  # =============================================================================
  # GITHUB RELEASE CREATION PHASE
  # Creates GitHub release as the final step after version is committed
  # =============================================================================

  create-release:
    name: Create GitHub Release
    needs: [validate, security, build, npm]
    # Run only if validate, security, and build all succeeded AND npm either
    # succeeded or was skipped. The explicit result checks are required
    # because using !cancelled() disables the implicit success() gate on needs.
    if: |
      needs.build.outputs.changed == 'true' &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.security.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Checkout the newly created tag
          ref: v${{ needs.build.outputs.version }}

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Only production dependencies needed for SBOM generation
        # Skip scripts to avoid running husky (dev dependency)
        run: pnpm install --prod --frozen-lockfile --ignore-scripts

      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx --out sbom.cdx.json

      - name: Create release artifacts
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG_SHA="${{ needs.build.outputs.tag_sha }}"
          tar -czf dist-${VERSION}-${TAG_SHA:0:7}.tar.gz dist/
          zip -r dist-${VERSION}-${TAG_SHA:0:7}.zip dist/

      - name: Extract release notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          awk -v version="## $VERSION" '
            $0 ~ version { flag=1; next }
            /^## [0-9]/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release v$VERSION" > release-notes.md
          fi

      # =============================================================================
      # SUPPLY CHAIN SECURITY
      # Generate attestations BEFORE creating the release so they exist by the
      # time the Publish workflow runs. NOTE: publishing the release triggers
      # Publish while this run is still in progress; determine-artifact.sh
      # waits for this run to complete and succeed before trusting its artifacts.
      # =============================================================================

      - name: Generate attestations
        # Generate SLSA provenance attestations for supply chain security
        # Requires id-token: write permission
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/**/*.js
            sbom.cdx.json
            dist-*-*.tar.gz
            dist-*-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            sbom.cdx.json
            dist-${{ needs.build.outputs.version }}-*.tar.gz
            dist-${{ needs.build.outputs.version }}-*.zip
          # Must be the `token` input: it defaults to github.token, which takes
          # precedence over a GITHUB_TOKEN env var. Releases created with
          # github.token do not trigger the Publish workflow.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set release output
        id: release
        run: |
          echo "released=true" >> $GITHUB_OUTPUT
          echo "✅ Released version ${{ needs.build.outputs.version }}"
