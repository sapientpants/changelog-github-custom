# =============================================================================
# WORKFLOW: NPM Package Publishing
# PURPOSE: Publish the attested release tarball to the npm registry
# TRIGGERS: GitHub release publication or manual dispatch
# OUTPUTS: Published package on npm with provenance
# =============================================================================

name: Publish

on:
  release:
    types: [published] # Triggered when a GitHub release is published
  workflow_dispatch: # Manual trigger for re-publishing or testing
    inputs:
      tag:
        description: 'Release tag to publish (e.g., v1.2.3)'
        required: true
        type: string

# Allow only one publish workflow per branch
# cancel-in-progress: false to allow multiple releases to proceed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Global environment variables for consistency
env:
  PNPM_VERSION: 11.20.0 # Pinned: Must match packageManager in package.json
  NODE_VERSION: 24 # Pinned: CI toolchain version; engines.node is the consumer floor (>=22.12)

# SECURITY: Minimal default permissions. Each job declares exactly what it
# needs (actions: read to fetch artifacts, id-token: write for npm provenance).
permissions:
  contents: read

jobs:
  # =============================================================================
  # FETCH NPM PACKAGE
  # Locates and downloads the tarball built and attested by the Main workflow.
  # =============================================================================

  fetch-npm-package:
    name: Fetch NPM package
    runs-on: ubuntu-latest
    if: vars.ENABLE_NPM_RELEASE == 'true'
    permissions:
      contents: read
      actions: read # Required to download artifacts from the Main run
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tarball: ${{ steps.verify.outputs.tarball }}
    steps:
      - name: Determine version
        id: version
        # Extract version from release tag or manual input
        # Strips 'v' prefix to get semver (v1.2.3 -> 1.2.3)
        run: |
          VERSION="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Fetching NPM package for version $VERSION"

      - name: Checkout CI scripts
        # Run helper scripts from the workflow's own commit, not the release
        # tag, so script fixes also apply when re-publishing an older tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts

      - name: Determine artifact source
        id: artifact
        # Find the NPM package artifact from the successful Main run that built
        # this release. The script waits for the Main run to complete, since the
        # release event fires while Main is still in progress.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/determine-artifact.sh
          .github/scripts/determine-artifact.sh \
            --tag "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --version "${{ steps.version.outputs.version }}" \
            --prefix "npm-package" \
            --output "$GITHUB_OUTPUT"

      - name: Download pre-built NPM package
        # Download the pre-built, pre-scanned, attested NPM package from Main
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ./npm-artifact
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tarball
        id: verify
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL=$(find ./npm-artifact -name "*.tgz" -type f | head -1)
          if [ -z "$TARBALL" ]; then
            echo "❌ No .tgz file found in artifact!"
            echo "Contents of ./npm-artifact:"
            ls -la ./npm-artifact/
            exit 1
          fi

          # The tarball is published unmodified, so its package.json must
          # already carry the released version
          PACKED_VERSION=$(tar -xzOf "$TARBALL" package/package.json | jq -r '.version')
          if [ "$PACKED_VERSION" != "$RELEASE_VERSION" ]; then
            echo "❌ Tarball version $PACKED_VERSION does not match release $RELEASE_VERSION"
            exit 1
          fi

          echo "tarball=$(basename "$TARBALL")" >> $GITHUB_OUTPUT
          echo "✅ Using pre-built NPM package: $TARBALL (version $PACKED_VERSION)"
          if [ -f ./npm-artifact/npm-package-manifest.txt ]; then
            echo "📋 Package contains $(wc -l < ./npm-artifact/npm-package-manifest.txt) files"
          fi

      - name: Share tarball with the npm job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ./npm-artifact/*.tgz
          retention-days: 1 # Only needed for this workflow run
          if-no-files-found: error

  # =============================================================================
  # NPM PUBLISHING
  # Publishes the attested tarball to the npm registry with provenance
  # =============================================================================

  npm:
    name: Publish to NPM
    needs: fetch-npm-package
    runs-on: ubuntu-latest
    # Only runs if ENABLE_NPM_RELEASE variable is set to 'true'
    # Configure in Settings > Secrets and variables > Variables
    if: vars.ENABLE_NPM_RELEASE == 'true'
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    steps:
      - name: Setup Node.js
        # Node.js is required for npm publish command
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Configure npm registry for authentication
          registry-url: 'https://registry.npmjs.org'

      - name: Download NPM package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ./npm-artifact

      - name: Publish to NPM
        env:
          TARBALL: ${{ needs.fetch-npm-package.outputs.tarball }}
        run: |
          # Publish the tarball exactly as built and attested by the Main
          # workflow. Do NOT extract and re-pack it: npm would produce a
          # different archive and the provenance attestation created in Main
          # would no longer match what is published.
          # Uses GitHub OIDC for authentication (no NPM_TOKEN needed)
          # --provenance creates a signed attestation of the build
          npm publish "./npm-artifact/$TARBALL" --provenance --access public
